<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="container">

    <div class="left-panel">

        <img
            src="https://static.vecteezy.com/system/resources/thumbnails/003/689/228/small_2x/online-registration-or-sign-up-login-for-account-on-smartphone-app-user-interface-with-secure-password-mobile-application-for-ui-web-banner-access-cartoon-people-illustration-vector.jpg"
            alt="Student"
        >

    </div>

    <div class="right-panel">

        <h2>Student Registration</h2>

        <p>Create your account to register for college events.</p>

        <form action="sign.php" method="POST" autocomplete="off">

            <div class="input-box">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="input-box">

                <label>Student ID</label>

                <input
                    type="text"
                    name="student_id"
                    placeholder="Enter your student ID"
                    required
                >

            </div>

            <div class="input-box">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="input-box">

                <label>Phone Number</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="98XXXXXXXX"
                    required
                >

            </div>

            <div class="input-box">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>

            <div class="input-box">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
