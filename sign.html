<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

<div class="container">

    <div class="left-panel">

        <img
            src="https://static.vecteezy.com/system/resources/thumbnails/003/689/228/small_2x/online-registration-or-sign-up-login-for-account-on-smartphone-app-user-interface-with-secure-password-mobile-application-for-ui-web-banner-access-cartoon-people-illustration-vector.jpg"
            alt="Student"
        >

    </div>


    <div class="right-panel">

        <h2>Student Registration</h2>

        <p>Create your account to register for college events.</p>


        <form action="signup.php" method="POST" autocomplete="off">
            <div class="input-box">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="input-box">

                <label for="student_id">Student ID</label>

                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    placeholder="Enter your student ID"
                    required
                >

            </div>


            <div class="input-box">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-box">

                <label for="phone">Phone Number</label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                    placeholder="98XXXXXXXX"
                    required
                >

            </div>


            <div class="input-box">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="input-box">

                <label for="confirm_password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

        <div style="margin-top: 15px; text-align: center;">
            <a href="index.html" style="color: #666; text-decoration: none; font-size: 13px;">← Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
