<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-box">

        <h2>🎓 CEMS</h2>
        <h3>College / Faculty Login</h3>

        <form action="login.php" method="POST">

            <label for="username">College ID / Email</label>
            <input
                type="text"
                id="username"
                name="college_id"
                placeholder="Enter College ID or Email"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>

            <button type="submit">Login</button>

        </form>

        <div style="margin-top: 15px; text-align: center; font-size: 13px;">
            <a href="../login.html" style="color: #0d6efd; text-decoration: none; margin: 0 6px;">Student Login</a> |
            <a href="../adminmodule/adminlogin.html" style="color: #0d6efd; text-decoration: none; margin: 0 6px;">Admin Login</a>
        </div>

        <div style="margin-top: 12px; text-align: center;">
            <a href="../index.html" style="color: #666; text-decoration: none; font-size: 13px;">← Back to Home</a>
        </div>

    </div>

</body>

</html>
