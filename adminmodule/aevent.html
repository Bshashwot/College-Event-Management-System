    <div class="topbar">

        <div>

            <h1>Add Event</h1>

            <p>Create a new college event</p>

        </div>

    </div>

    <div class="form-container">

        <form id="eventForm" action="add_event.php" method="POST">

            <div class="row">

                <div class="input-box">

                    <label for="event_name">Event Name</label>

                    <input type="text" id="event_name" name="event_name" placeholder="Enter Event Name" required>

                </div>

                <div class="input-box">

                    <label for="category">Category</label>

                    <select id="category" name="category" required>

                        <option value="">Select Category</option>
                        <option value="Workshop">Workshop</option>
                        <option value="Seminar">Seminar</option>
                        <option value="Hackathon">Hackathon</option>
                        <option value="Sports">Sports</option>
                        <option value="Cultural">Cultural</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label for="event_date">Event Date</label>

                    <input type="date" id="event_date" name="event_date" required>

                </div>

                <div class="input-box">

                    <label for="event_time">Event Time</label>

                    <input type="time" id="event_time" name="event_time">

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label for="venue">Venue</label>

                    <input type="text" id="venue" name="venue" placeholder="Enter Venue" required>

                </div>

                <div class="input-box">

                    <label for="organizer">Organizer / Club</label>

                    <input type="text" id="organizer" name="organizer" placeholder="Organizer Name">

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label for="max_participants">Maximum Participants</label>

                    <input type="number" id="max_participants" name="max_participants" placeholder="100">

                </div>

                <div class="input-box">

                    <label for="status">Initial Status</label>

                    <select id="status" name="status">

                        <option value="Pending">Pending (Requires College Approval)</option>
                        <option value="Approved">Approved</option>

                    </select>

                </div>

            </div>

            <div class="input-box">

                <label for="description">Description</label>

                <textarea id="description" name="description" rows="6" placeholder="Write event description..." required></textarea>

            </div>

            <div class="buttons">

                <button type="submit">Add Event</button>

                <button type="reset" class="reset">Reset</button>

            </div>

        </form>

    </div>

</div>
