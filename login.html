<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="log.css">
</head>

<body>

<div class="login-container">

    <h2>Student Login</h2>

    <form action="login.php" method="POST" autocomplete="off">

        <div class="input-group">

            <label for="student_id">
                Student ID
            </label>

            <input
                type="text"
                id="student_id"
                name="student_id"
                required
            >

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="signup-link">

        Don't have an account?

        <a href="sign.html">
            Sign Up
        </a>

    </div>

    <div style="margin-top: 15px; text-align: center; font-size: 14px;">
        <a href="collegemodule/login.html" style="color: #0d6efd; text-decoration: none; margin: 0 8px;">College Login</a> |
        <a href="adminmodule/adminlogin.html" style="color: #0d6efd; text-decoration: none; margin: 0 8px;">Admin Login</a>
    </div>

    <div style="margin-top: 15px; text-align: center;">
        <a href="index.html" style="color: #666; text-decoration: none; font-size: 13px;">← Back to Home</a>
    </div>

</div>

</body>
</html>
